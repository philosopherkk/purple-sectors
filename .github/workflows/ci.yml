name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  no-pages-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if pages.yml exists
        run: sh scripts/check-no-pages-workflow.sh
      - name: Fixture that restores pages.yml fails
        run: sh scripts/check-no-pages-workflow.test.sh
